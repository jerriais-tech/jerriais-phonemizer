[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jerriais-phonemizer"
version = "1.0.2"
description = "Jèrriais (Jersey Norman French) to IPA phonemizer, written in Snowball"
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "python/jerriais_phonemizer/_snowball/COPYING"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/jerriais-tech/jerriais-phonemizer"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["python/jerriais_phonemizer"]

[tool.hatch.build.targets.sdist]
include = ["python/", "src/", "tests/", "Makefile", "README.md", "LICENSE"]
# The spellchecker word list and its snapshot (3.6 MB) are left out for size; the test that uses them skips.
exclude = ["tests/jerriais.dic", "tests/snapshot.dic"]
